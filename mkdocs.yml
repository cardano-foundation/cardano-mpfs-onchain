site_name: Cardano MPFS Onchain
site_url: https://cardano-foundation.github.io/cardano-mpfs-onchain/
repo_url: https://github.com/cardano-foundation/cardano-mpfs-onchain

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Follow the system preference
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.integrate
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Development: development.md
  - Haskell Cage Library: haskell-cage.md
  - Architecture:
      - Overview: architecture/overview.md
      - Validators: architecture/validators.md
      - Types & Encodings: architecture/types.md
      - Proof System: architecture/proofs.md
      - Security Properties: architecture/properties.md
  - Design:
      - Permissionless multi-oracle registries:
          - design/registries/index.md
          - Request lifecycle: design/registries/lifecycle.md
          - Decisions: design/registries/decisions.md
          - Economics: design/registries/economics.md
          - Oracle identities: design/registries/oracles.md
          - Oracle slots (draft): design/registries/slots.md
          - Formal model and audits: design/registries/formal-model.md
